name: Release AAB to Play

# Builds the signed release AAB and uploads it to the Play internal testing track.
# Runs when a version tag is pushed (e.g. git tag v2.0 && git push origin v2.0)
# or manually from the Actions tab. Requires the five repository secrets:
#   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
#   PLAY_SERVICE_ACCOUNT_JSON
# The app must already exist in Play Console with package
# com.schwing.allergycard and the service account must have release access.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Check required secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; missing=1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "Missing secret KEYSTORE_PASSWORD"; missing=1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing secret KEY_ALIAS"; missing=1; }
          [ -n "$KEY_PASSWORD" ] || { echo "Missing secret KEY_PASSWORD"; missing=1; }
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "Missing secret PLAY_SERVICE_ACCOUNT_JSON"; missing=1; }
          exit $missing

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Upload AAB to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.schwing.allergycard
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 0
